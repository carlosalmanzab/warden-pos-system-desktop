spring:
  config:
    activate:
      on-profile: dev
  flyway:
    enabled: true
    locations: classpath:db/migration/sqlite
    clean-disabled: false
    validate-on-migrate: true

logging:
  level:
    org:
      jooq:
        tools:
          LoggerListener: debug

