[versions]
# plugins version ref
springBoot = "4.1.0"
springDependencyManagement = "1.1.7"
graalvm = "1.1.2"
jooq = "3.21.6"
spotless = "8.8.0"
spotbugs = "6.5.9"

# libraries versions ref
mapstruct = "1.6.3"
jjwt = "0.13.0"
springdoc = "2.8.4"
uuidGenerator = "4.3.0"
sqlite = "3.46.1.3"

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvm" }
jooq-codegen = { id = "org.jooq.jooq-codegen-gradle", version.ref = "jooq" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs" }

[libraries]
mapstruct-core = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }

jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

springdoc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
uuid-generator = { module = "com.fasterxml.uuid:java-uuid-generator", version.ref = "uuidGenerator" }
sqlite = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }