plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.graalvm.buildtools.native' version '1.1.2'
	id "org.jooq.jooq-codegen-gradle" version "3.21.6"
}

group = 'me.carlosalmanzab.wardenpos'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
		vendor = JvmVendorSpec.matching("GraalVM")
	}
}

repositories {
	mavenCentral()
}

sourceSets {
	codegenTools {
		java {
			srcDirs = ['src/codegenTools/java']
		}
	}
}

configurations {
	codegenMigrationRuntime
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-jooq'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	implementation('org.springframework.boot:spring-boot-starter-webmvc') {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
		exclude group: 'com.fasterxml.jackson.dataformat', module: 'jackson-dataformat-xml'
	}
	implementation 'org.springframework.boot:spring-boot-starter-jetty'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.xerial:sqlite-jdbc'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	compileOnly 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.2'

	jooqCodegen 'org.xerial:sqlite-jdbc:3.46.1.3'

	codegenToolsImplementation 'org.flywaydb:flyway-core:11.7.2'
	codegenToolsImplementation 'org.xerial:sqlite-jdbc:3.46.1.3'
}

def toolchainService = project.extensions.getByType(JavaToolchainService)
def javaPluginExtension = project.extensions.getByType(JavaPluginExtension)
def targetLauncher = toolchainService.launcherFor(javaPluginExtension.toolchain)

def profile = project.hasProperty('targetEnv') ? project.property('targetEnv') : 'dev'

def codegenDbPath = project.layout.buildDirectory.file('generated-db/wardenpos.db').get().asFile.path
def migrationsDir = project.layout.projectDirectory.dir('src/main/resources/db/migration').asFile.path


jooq {
	configuration {
		jdbc {
			driver = 'org.sqlite.JDBC'
			url = "jdbc:sqlite:${codegenDbPath}"
		}
		generator {
			target {
				packageName = 'me.carlosalmanzab.wardenpos.jooq.generated'
				directory = project.layout.buildDirectory.dir('generated-src/jooq/main').get().asFile.path
			}
			database {
				excludes = 'flyway_schema_history'
			}
			generate {
				// Allows for turning on POJOs generation: default false
				pojos = true
				pojosIncludes = ".*"
				pojosExcludes = "SYSTEM_TABLE_.*"
			}
		}
	}
}

graalvmNative {
	binaries {
		main {
			imageName = 'wardenpos-backend'

			javaLauncher.set(targetLauncher)

			buildArgs.add('--initialize-at-build-time=org.sqlite.JDBC')
			buildArgs.add('--initialize-at-run-time=org.sqlite.core.DB')

			if (profile == 'prod') {
				buildArgs.add('-O2')
				buildArgs.add('--no-fallback')
				println "compile native binary in PRODUCTION ENV"
			} else {
				buildArgs.add('-Ob')
				println "compile native binary in DEVELOPMENT ENV"
			}
		}
	}
}

tasks.register('migrateForCodegen', JavaExec) {
	dependsOn tasks.named('compileCodegenToolsJava')
	classpath = sourceSets.codegenTools.output + sourceSets.codegenTools.runtimeClasspath
	mainClass.set('me.carlosalmanzab.wardenpos.buildtools.JooqCodegenMigrationRunner')
	args = [codegenDbPath, migrationsDir]
}

tasks.named('jooqCodegen') {
	dependsOn 'migrateForCodegen'
}

tasks.named('test') {
	useJUnitPlatform()
}